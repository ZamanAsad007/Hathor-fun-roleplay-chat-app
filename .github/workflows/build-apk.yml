name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach APK to (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          cd app
          npm ci

      - name: Inject Client Environment Configuration
        run: |
          cat << 'EOF' > app/.env
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://bkuiwsoylzelnzvfuzwd.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrdWl3c295bHplbG56dmZ1endkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NDEwMDMsImV4cCI6MjEwODMxNzAwM30.R6v24lWYYWP3QPyHtAQ7QLidow3aJ2syPLD7I3lsTUA' }}
          EXPO_PUBLIC_APP_SECRET=${{ secrets.EXPO_PUBLIC_APP_SECRET || '8b95b88088443c60ceca52d5e365aa61df6c34d5d9e0963c90eb22a08bedafed' }}
          EOF

      - name: Generate Android Native Project (Expo Prebuild)
        run: |
          cd app
          npx expo prebuild --platform android --clean

      - name: Build Android Standalone Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          RELEASE_APK=$(find app/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "::error::No release APK was generated!"
            exit 1
          fi
          echo "Found standalone release APK at: $RELEASE_APK"
          cp "$RELEASE_APK" build-output/Hathor-v0.1.0.apk
          ls -lh build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hathor-Android-APK
          path: build-output/Hathor-v0.1.0.apk

      - name: Attach APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ -z "$TAG_NAME" || "$TAG_NAME" == "main" || "$TAG_NAME" == "phase-"* || "$TAG_NAME" == "fix/"* ]]; then
            TAG_NAME="v0.1.0"
          fi
          echo "Uploading standalone release APK to release: $TAG_NAME"
          gh release upload "$TAG_NAME" build-output/Hathor-v0.1.0.apk --clobber
