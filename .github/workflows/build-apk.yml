name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach APK to (e.g. v0.1.1)'
        required: false
        default: 'v0.1.1'
      architectures:
        description: 'Target architectures to build (arm64-v8a,armeabi-v7a for mobile speedup, or armeabi-v7a,arm64-v8a,x86,x86_64 for universal)'
        required: false
        default: 'arm64-v8a,armeabi-v7a'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Setup Java JDK & Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle Build Tooling
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: |
          cd app
          npm ci

      - name: Inject Client Environment Configuration
        run: |
          cat << 'EOF' > app/.env
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://bkuiwsoylzelnzvfuzwd.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrdWl3c295bHplbG56dmZ1endkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NDEwMDMsImV4cCI6MjEwODMxNzAwM30.R6v24lWYYWP3QPyHtAQ7QLidow3aJ2syPLD7I3lsTUA' }}
          EOF

      - name: Generate Android Native Project (Expo Prebuild)
        run: |
          cd app
          npx expo prebuild --platform android --clean

      - name: Build Android Standalone Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m' -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: |
          cd app/android
          chmod +x gradlew
          ARCHS="${{ github.event.inputs.architectures || 'arm64-v8a,armeabi-v7a' }}"
          echo "Building standalone APK with architectures: $ARCHS"
          ./gradlew assembleRelease \
            -PreactNativeArchitectures="$ARCHS" \
            --build-cache \
            --parallel \
            --max-workers=$(nproc) \
            -x lint -x lintVitalRelease \
            --daemon
          ./gradlew --stop

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          RELEASE_APK=$(find app/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "::error::No release APK was generated!"
            exit 1
          fi
          echo "Found standalone release APK at: $RELEASE_APK"

          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ -z "$TAG_NAME" || "$TAG_NAME" == "main" || "$TAG_NAME" == "phase-"* || "$TAG_NAME" == "fix/"* ]]; then
            TAG_NAME="v0.1.1"
          fi

          cp "$RELEASE_APK" "build-output/Hathor-${TAG_NAME}.apk"
          cp "$RELEASE_APK" "build-output/hathor.apk"
          ls -lh build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hathor-Android-APK
          path: build-output/*.apk

      - name: Attach APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ -z "$TAG_NAME" || "$TAG_NAME" == "main" || "$TAG_NAME" == "phase-"* || "$TAG_NAME" == "fix/"* ]]; then
            TAG_NAME="v0.1.1"
          fi
          echo "Uploading standalone release APK to release: $TAG_NAME"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" build-output/Hathor-${TAG_NAME}.apk build-output/hathor.apk --clobber
          else
            gh release create "$TAG_NAME" build-output/Hathor-${TAG_NAME}.apk build-output/hathor.apk \
              --title "Hathor $TAG_NAME - Hotfix & Stability Release" \
              --notes-file RELEASE.md
          fi
